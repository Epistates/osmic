[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
    "crates/osmic-core",
    "crates/osmic-osm",
    "crates/osmic-geo",
    "crates/osmic-index",
    "crates/osmic-style",
    "crates/osmic-tiles",
    "crates/osmic-render",
    "crates/osmic-text",
    "crates/osmic-app",
    "crates/osmic-serve",
    "crates/osmic-extract",
    "crates/osmic-accel",
    "crates/osmic-repl",
    "crates/osmic",
    "bins/osmic-cli",
    "bins/osmic-viewer",
    "examples/load-pbf",
    "examples/render-static",
    "examples/tile-server",
    "examples/custom-plugin",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/epistates/osmic"
authors = ["Nick Paterno"]
readme = "README.md"

[workspace.dependencies]
# Internal crates — version + path so `cargo publish` resolves via registry
osmic-core = { version = "0.1.1", path = "crates/osmic-core" }
osmic-osm = { version = "0.1.1", path = "crates/osmic-osm", default-features = false }
osmic-geo = { version = "0.1.1", path = "crates/osmic-geo" }
osmic-index = { version = "0.1.1", path = "crates/osmic-index" }
osmic-style = { version = "0.1.1", path = "crates/osmic-style" }
osmic-tiles = { version = "0.1.1", path = "crates/osmic-tiles" }
osmic-render = { version = "0.1.1", path = "crates/osmic-render" }
osmic-text = { version = "0.1.1", path = "crates/osmic-text" }
osmic-app = { version = "0.1.1", path = "crates/osmic-app" }
osmic-serve = { version = "0.1.1", path = "crates/osmic-serve" }
osmic-extract = { version = "0.1.1", path = "crates/osmic-extract" }
osmic-accel = { version = "0.1.1", path = "crates/osmic-accel" }
osmic-repl = { version = "0.1.1", path = "crates/osmic-repl" }

# Parsing & data
osmpbf = "0.3"
rayon = "1.12"
memmap2 = "0.9.11"
lasso = { version = "0.7", features = ["multi-threaded"] }

# Geometry
geo-types = { version = "0.7", features = ["serde"] }
geo = "0.33"
rstar = "0.13"

# Tile & format
pmtiles = { version = "0.24", default-features = false }
moka = { version = "0.12.16", features = ["future"] }

# Rendering
wgpu = "30"
naga = "30"
lyon = "1.0"
tiny-skia = "0.12"
cosmic-text = "0.19"
winit = "0.30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
csscolorparser = "0.9"
lru = "0.18"

# Server
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["compression-gzip", "cors", "set-header"] }
bytes = "1"
tokio = { version = "1", features = ["full"] }

# Utility
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
smallvec = { version = "1.16", features = ["serde"] }
smol_str = "0.3.6"
rustc-hash = "2"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
tempfile = "3"
csv = "1.4"
anyhow = "1"
ctrlc = { version = "3.5", features = ["termination"] }
unicode-normalization = "0.1"
clap = { version = "4", features = ["derive"] }
mimalloc = "0.1.52"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
