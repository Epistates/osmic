[package]
name = "osmic-serve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories = ["web-programming::http-server", "science::geo"]
keywords = ["tile-server", "mvt", "pmtiles", "axum", "map"]
readme.workspace = true
description = "HTTP tile server for PMTiles archives with HTTP caching, CORS, resource limits and a MapLibre viewer"

[dependencies]
osmic-app = { workspace = true }
osmic-style = { workspace = true }
osmic-tiles = { workspace = true, features = ["reader"] }
axum = { workspace = true }
tower = { workspace = true, features = ["limit", "load-shed"] }
tower-http = { workspace = true, features = ["compression-gzip", "cors", "timeout", "trace"] }
tokio = { workspace = true }
hyper-util = { workspace = true }
pmtiles = { workspace = true, features = ["mmap-async-tokio"] }
tracing = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
flate2 = { workspace = true }
twox-hash = { version = "2", default-features = false, features = ["xxhash3_64"] }

[dev-dependencies]
pmtiles = { workspace = true, features = ["mmap-async-tokio", "write"] }
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
tempfile = { workspace = true }

[lints]
workspace = true
