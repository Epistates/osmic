[package]
name = "osmic-tiles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories = ["science::geo", "visualization"]
keywords = ["mvt", "pmtiles", "vector-tiles", "osm", "gis"]
readme.workspace = true
description = "Vector tile pipeline: render OSM features into MVT/MLT tiles via a parallel external sort and write PMTiles archives"

[features]
default = ["native"]
native = ["dep:rayon", "dep:pmtiles", "dep:tempfile", "osmic-osm/native"]
# MapLibre Tile output. `mlt-core` tracks the evolving MLT spec and needs
# Rust 1.98, above this crate's MSRV.
mlt = ["dep:mlt-core"]

[dependencies]
osmic-core = { workspace = true }
osmic-osm = { workspace = true, default-features = false }
flate2 = { workspace = true }
geo-types = { workspace = true }
mlt-core = { version = "0.19", optional = true }
pmtiles = { workspace = true, features = ["write"], optional = true }
rayon = { workspace = true, optional = true }
serde_json = { workspace = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
geo = { workspace = true }
bytes = { workspace = true }

[lints]
workspace = true
