[package]
name = "osmic-accel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories = ["science::geo", "hardware-support"]
keywords = ["metal", "gpu", "geometry", "macos", "accelerator"]
readme.workspace = true
description = "GPU-accelerated geometry clipping for tile generation (Apple Silicon Metal) with a CPU reference"
build = "build.rs"

[package.metadata.docs.rs]
# The Metal backend only exists on Apple platforms. docs.rs does not ship the
# Metal toolchain, so the shaders are not compiled there (build.rs honours
# `DOCS_RS`); the public API is identical either way.
targets = ["aarch64-apple-darwin"]

[dependencies]
osmic-core = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
geo-types = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
bytemuck = { workspace = true }
# The objc2 family, at the versions wgpu-hal already pulls in, so the Metal
# backend adds no duplicate bindings to the tree.
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "block2", "objc2"] }
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSError",
    "NSString",
] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "bitflags",
    "dispatch2",
    "MTLAllocation",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLDevice",
    "MTLLibrary",
    "MTLResource",
    "MTLTypes",
] }

[lints]
workspace = true
