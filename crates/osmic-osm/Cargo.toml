[package]
name = "osmic-osm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["science::geo", "parser-implementations"]
keywords = ["osm", "openstreetmap", "pbf", "parser", "tags"]
readme.workspace = true
description = "OSM data model, PBF parsing, tag system, and classification"

[features]
default = ["native"]
native = ["dep:osmpbf", "dep:rayon", "dep:flate2"]

[dependencies]
osmic-core = { workspace = true }
osmic-geo = { workspace = true }
osmic-index = { workspace = true }
flate2 = { workspace = true, optional = true }
rstar = { workspace = true }
rustc-hash = { workspace = true }
thiserror = { workspace = true }
osmpbf = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
lasso = { workspace = true }
geo = { workspace = true }
geo-types = { workspace = true }
smallvec = { workspace = true }
smol_str = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
