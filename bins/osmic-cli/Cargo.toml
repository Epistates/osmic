[package]
name = "osmic-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["command-line-utilities", "science::geo"]
keywords = ["osm", "pbf", "tiles", "cli", "map"]
readme.workspace = true
description = "CLI for tile generation, PBF inspection, render-to-image"

[[bin]]
name = "osmic"
path = "src/main.rs"

[features]
default = []
mlt = ["osmic-tiles/mlt"]

[dependencies]
osmic-core = { workspace = true }
osmic-extract = { workspace = true }
osmic-index = { workspace = true }
osmic-osm = { workspace = true, features = ["native"] }
osmic-repl = { workspace = true }
osmic-serve = { workspace = true }
osmic-style = { workspace = true }
osmic-tiles = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
ctrlc = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
