[package]
name = "osmic-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories = ["command-line-utilities", "science::geo"]
keywords = ["osm", "pbf", "tiles", "cli", "map"]
readme.workspace = true
description = "OpenStreetMap to vector tiles: generate PMTiles, inspect PBF files, extract entities, serve tiles and apply replication updates"

[[bin]]
name = "osmic"
path = "src/main.rs"

[features]
default = []
mlt = ["osmic-tiles/mlt"]

[dependencies]
osmic-core = { workspace = true }
osmic-extract = { workspace = true }
osmic-osm = { workspace = true, features = ["native"] }
osmic-repl = { workspace = true }
osmic-serve = { workspace = true }
osmic-style = { workspace = true }
osmic-tiles = { workspace = true, features = ["native", "reader"] }
anyhow = { workspace = true }
clap = { workspace = true }
mimalloc = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }

# Interrupt handling: signal-hook reports which signal arrived (for the
# 128+N exit status); ctrlc covers Windows console events.
[target.'cfg(unix)'.dependencies]
signal-hook = { workspace = true }

[target.'cfg(not(unix))'.dependencies]
ctrlc = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
bytes = { workspace = true }
flate2 = { workspace = true }
osmpbf = { workspace = true }
pmtiles = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
